<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Order online</title>
<style>
:root{--bg:#f6f1ea;--cd:#fffdf9;--tx:#231418;--mu:#7b6a6d;--ac:#6b1d33;--br:#a87a25;--ln:#e6dacd;--ok:#1d7a45;--bad:#b73a2c;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#150d10;--cd:#22161a;--tx:#f5ebe6;--mu:#ab989b;--ac:#c2456b;--br:#d8a954;--ln:#3b2a30;--ok:#4cc27e;--bad:#ff7d6d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--ac);color:#fff;padding:14px 16px;font-size:18px;font-weight:700;position:sticky;top:0;z-index:5}
.wrap{max-width:640px;margin:auto;padding:14px 14px 130px}.card{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:10px 0}
.us{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.us button{flex:1;min-width:90px;padding:9px 4px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}.us button:disabled{opacity:.4}.us small{display:block;color:var(--br);font-weight:700}
small,.mu{color:var(--mu);font-size:12px}.in{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--tx);font:inherit;margin:4px 0}
.b,.b2{width:100%;padding:13px;border-radius:10px;border:1px solid var(--ac);font:inherit;font-weight:700;margin:4px 0;cursor:pointer}.b{background:var(--ac);color:#fff}.b2{background:var(--cd);color:var(--ac)}.b:disabled{opacity:.5}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:auto;background:var(--tx);color:var(--bg);border-radius:14px;padding:14px;display:flex;justify-content:space-between;cursor:pointer}
.ln{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--ln)}.tt{display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding:8px 0}
.st{display:flex;justify-content:space-between;margin:14px 0}.st div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.st i{display:block;width:22px;height:22px;border-radius:50%;background:var(--ln);margin:0 auto 4px}.st .on{color:var(--tx);font-weight:700}.st .on i{background:var(--ok)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.hp{position:absolute;left:-9999px}label.ck{display:flex;gap:8px;align-items:flex-start;margin:10px 0}
</style></head><body><header id="h">Order online</header><div class="wrap" id="r"></div>
<script>
const $=i=>document.getElementById(i),F=n=>'KSh '+Math.round(n).toLocaleString('en-KE');
let C=null,cart={},U={},tok=null,poll=null;try{tok=localStorage.getItem('shoptok')}catch(e){}
const api=async(p,b)=>{const r=await fetch('/api/public'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Something went wrong');return j};
const items=()=>Object.keys(cart).filter(k=>cart[k]>0),total=()=>items().reduce((a,k)=>a+U[k].price*cart[k],0);
async function init(){try{C=await api('/catalog')}catch(e){$('r').innerHTML=`<div class="card"><b>Online ordering is unavailable</b><p class="mu">${e.message}</p></div>`;return}$('h').textContent=C.biz;C.products.forEach(p=>p.units.forEach(u=>U[u.id]={...u,name:p.name}));const hh=location.hash.slice(1);if(/^[a-f0-9]{24}$/.test(hh)){tok=hh;try{localStorage.setItem('shoptok',tok)}catch(e){}}tok?track():menu()}
function menu(){clearInterval(poll);const cats=[...new Set(C.products.map(p=>p.category))],n=items().reduce((a,k)=>a+cart[k],0);
 $('r').innerHTML=`<p class="mu">Delivery fee ${F(C.fee)}. You must be of legal drinking age. ID is checked on delivery.</p>`+cats.map(c=>`<h3>${c}</h3>`+C.products.filter(p=>p.category==c).map(p=>`<div class="card"><b>${p.name}</b><div class="us">${p.units.map(u=>`<button ${u.available?'':'disabled'} onclick="add(${u.id})">${u.label}<small>${F(u.price)}</small>${cart[u.id]?'<small class="ok">× '+cart[u.id]+'</small>':''}</button>`).join('')}</div></div>`).join('')).join('')+(n?`<div class="bar" onclick="form()"><span>${n} item(s) · ${F(total())}</span><b>Checkout ›</b></div>`:'')}
function add(id){cart[id]=Math.min((cart[id]||0)+1,24);menu()}
function form(){const rows=items().map(k=>`<div class="ln"><span>${U[k].name} ${U[k].label}</span><span><button class="b2" style="width:34px;padding:2px" onclick="chg(${k},-1)">−</button> ${cart[k]} <button class="b2" style="width:34px;padding:2px" onclick="chg(${k},1)">+</button></span></div>`).join('');
 $('r').innerHTML=`<button class="b2" onclick="menu()">‹ Back to menu</button><div class="card"><b>Your order</b>${rows}<div class="ln"><span>Delivery</span><span>${F(C.fee)}</span></div><div class="tt"><span>Total</span><span>${F(total()+C.fee)}</span></div></div>
 <div class="card"><input class="in" id="nm" placeholder="Your name"><input class="in" id="ph" inputmode="tel" placeholder="Phone (07…)"><input class="in" id="ad" placeholder="Delivery address / landmark"><input class="in" id="nt" placeholder="Notes (optional)"><input class="hp" id="web" tabindex="-1" autocomplete="off">
 <label class="ck"><input type="checkbox" id="ag"> <span>I am of legal drinking age (18+) and will show ID on delivery.</span></label><button class="b" id="pm" onclick="place(true)">Pay now with M-Pesa</button><button class="b2" onclick="place(false)">Pay on delivery</button><p class="bad" id="er"></p></div>`}
function chg(k,d){cart[k]=Math.max(0,(cart[k]||0)+d);items().length?form():menu()}
async function place(pay){$('er').textContent='';try{const r=await api('/orders',{name:$('nm').value,phone:$('ph').value,address:$('ad').value,notes:$('nt').value,website:$('web').value,age_confirm:$('ag').checked,items:items().map(k=>({unit_id:+k,qty:cart[k]}))});tok=r.token;try{localStorage.setItem('shoptok',tok)}catch(e){}cart={};if(pay)await api('/orders/'+tok+'/pay',{}).catch(e=>{});track()}catch(e){$('er').textContent=e.message}}
async function pay(){try{await api('/orders/'+tok+'/pay',{phone:$('pp')?$('pp').value:''});draw()}catch(e){alert(e.message)}}
function track(){clearInterval(poll);draw();poll=setInterval(draw,4000)}
function done(){try{localStorage.removeItem('shoptok')}catch(e){}tok=null;menu()}
async function draw(){let o;try{o=await api('/orders/'+tok)}catch(e){return done()}const S=['new','picking','packed','dispatched','delivered'],L=['Received','Preparing','Packed','On the way','Delivered'],i=S.indexOf(o.status),end=o.status=='delivered'||o.status=='cancelled';if(end)clearInterval(poll);
 const pay=o.paid?`<p class="ok"><b>Paid ✓</b> M-Pesa ${o.receipt||''}</p>`:o.pay_status=='pending'?'<p><b>Check your phone</b> and enter your M-Pesa PIN…</p>':`<p>${o.pay_status?'<span class="bad">Payment did not go through. </span>':''}You can pay <b>${F(o.total)}</b> on delivery or now with M-Pesa.</p><input class="in" id="pp" inputmode="tel" placeholder="M-Pesa number (optional)"><button class="b" onclick="pay()">Pay ${F(o.total)} with M-Pesa</button>`;
 $('r').innerHTML=`<div class="card"><b>Order ${o.no}</b>${o.status=='cancelled'?'<p class="bad">This order was cancelled.</p>':`<div class="st">${L.map((l,k)=>`<div class="${k<=i?'on':''}"><i></i>${l}</div>`).join('')}</div>`}${o.driver?`<p class="mu">Rider: ${o.driver}</p>`:''}${o.items.map(x=>`<div class="ln"><span>${x.qty} × ${x.name} ${x.label}</span><span>${F(x.qty*x.price)}</span></div>`).join('')}<div class="ln"><span>Delivery</span><span>${F(o.fee)}</span></div><div class="tt"><span>Total</span><span>${F(o.total)}</span></div>${end?'':pay}</div>${end?'<button class="b" onclick="done()">Order again</button>':''}`}
init();
</script></body></html>
