const Cam={on:false,h:null,stream:null,det:null,rd:null,last:'',lt:0,loop:0,opts:{},
 async open(h,o={}){if(this.on)this.close();this.h=h;this.opts=o;this.on=true;this.last='';
  const d=document.createElement('div');d.id='cam';d.innerHTML=`<div class="camtop"><b>${esc(o.title||'Scan')}</b><button class="b2 sm" id="camt" style="display:none" onclick="Cam.torch()">🔦</button><button class="b sm" onclick="Cam.close()">Done</button></div><video id="camv" playsinline muted></video><div class="camframe"></div><div class="camfoot"><div id="camm">Point the camera at a barcode</div><small id="camy">${o.tally?esc(o.tally()):''}</small><div class="row" style="margin-top:8px"><input id="camc" class="in" placeholder="Or type the code" onkeydown="if(event.key=='Enter'){Cam.hit(this.value);this.value=''}"></div></div>`;document.body.appendChild(d);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){this.msg('Camera needs a secure (https) connection. Type the code below instead.',1);return}
  try{this.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});const v=$('camv');v.srcObject=this.stream;await v.play();
   const tr=this.stream.getVideoTracks()[0],cap=tr.getCapabilities?tr.getCapabilities():{};if(cap.torch)$('camt').style.display='';
   if('BarcodeDetector' in window){try{this.det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code']})}catch(e){}}
   if(this.det)this.tick();else await this.zx()}
  catch(e){this.msg(e&&e.name=='NotAllowedError'?'Camera permission was blocked. Allow it in the browser, or type the code below.':'Could not start the camera ('+(e.message||e)+'). Type the code below.',1)}},
 async zx(){if(!window.ZXing)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='/vendor/zxing.min.js';s.onload=ok;s.onerror=()=>no(Error('scanner library missing'));document.head.appendChild(s)});
  const Z=window.ZXing,hints=new Map();hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.ITF]);this.rd=new Z.BrowserMultiFormatReader(hints,300);
  this.rd.decodeFromStream(this.stream,$('camv'),(r)=>{if(r&&this.on)this.hit(r.getText())})},
 async tick(){const v=$('camv');if(!this.on||!v)return;try{if(v.readyState>=2){const r=await this.det.detect(v);if(r&&r[0])this.hit(r[0].rawValue)}}catch(e){}this.loop=setTimeout(()=>this.tick(),180)},
 hit(code){code=String(code||'').trim();if(!code||!this.on)return;const n=Date.now();if(code==this.last&&n-this.lt<1500)return;this.last=code;this.lt=n;let r;try{r=this.h(code)}catch(e){r={ok:false,msg:e.message}}
  if(r&&r.then)r.then(x=>this.res(x));else this.res(r)},
 res(r){if(!this.on||!r)return;this.msg(r.msg||(r.ok?'Scanned':'Not recognised'),!r.ok);const y=$('camy');if(y&&this.opts.tally)y.textContent=this.opts.tally()},
 msg(t,bad){const m=$('camm');if(m){m.textContent=t;m.className=bad?'bad':'ok'}},
 async torch(){try{const tr=this.stream.getVideoTracks()[0];this.tf=!this.tf;await tr.applyConstraints({advanced:[{torch:this.tf}]})}catch(e){}},
 close(){this.on=false;clearTimeout(this.loop);try{this.rd&&this.rd.reset()}catch(e){}this.rd=null;if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null}const d=$('cam');if(d)d.remove()}};

 <div class="kp"><div><small>Sales</small><b>${F(t.revenue)}</b>${dlt(t.revenue,p.revenue)}</div><div><small>Gross profit</small><b class="ok">${F(t.profit)}</b>${dlt(t.profit,p.profit)}</div><div class="link" onclick="go2('exp')"><small>Expenses</small><b>${F(t.expenses)}</b>${dlt(t.expenses,p.expenses)}</div><div><small>Net profit</small><b class="${t.net<0?'bad':'ok'}">${F(t.net)}</b>${dlt(t.net,p.net)}</div><div><small>Transactions</small><b>${t.n}</b>${dlt(t.n,p.n)}</div><div><small>Average sale</small><b>${t.n?F(t.revenue/t.n):'-'}</b></div></div>
 ${al.length?`<div class="card"><div class="hb2"><b>Needs attention</b><a class="lnk" onclick="alertsM()">See all (${(A.alerts||[]).length})</a></div>${al.map(a=>`<div class="al ${a.sev}" onclick="alertGo(${(A.alerts||[]).indexOf(a)})"><span class="ai">${AI[a.kind]||'🔔'}</span><div><b>${esc(a.title)}</b><small>${esc(a.body)}</small></div></div>`).join('')}</div>`:''}
 <div class="grid">
 <div class="card"><b>Tills right now</b>${d.shifts.length?d.shifts.map(s=>`<div class="rowx"><span>${esc(s.name)}<small>open ${ago(s.open_ts)}</small></span><b>${F(s.cash_sales+s.open_cash)}<small class="mu" style="display:block;text-align:right">cash expected</small></b></div>`).join(''):'<p class="mu">No tills open.</p>'}</div>
 <div class="card"><b>Orders</b><div class="rowx link" onclick="go2('orders')"><span>New web orders</span><b class="${d.orders.web?'bad':''}">${d.orders.web}</b></div><div class="rowx link" onclick="go2('orders')"><span>In progress</span><b>${d.orders.open}</b></div><div class="rowx link" onclick="stockAlerts()"><span>Out of stock / low</span><b class="${d.stock.out?'bad':d.stock.low?'warnc':''}">${d.stock.out} / ${d.stock.low}</b></div></div>
 <div class="card"><b>Money</b><div class="rowx link" onclick="go2('cust')"><span>Owed to you<small>${d.receivables.debtors} customer(s)</small></span><b>${F(d.receivables.total)}</b></div><div class="rowx link" onclick="go2('buy')"><span>You owe suppliers<small>${d.payables.n} bill(s)${d.payables.overdue?' · <span class="bad">'+F(d.payables.overdue)+' overdue</span>':''}</small></span><b>${F(d.payables.total)}</b></div><div class="rowx"><span>Discounts given<small>${d.discounts.n} sale(s)</small></span><b>${F(d.discounts.s)}</b></div></div>
 <div class="card"><b>Top sellers</b>${d.top.map(x=>`<div style="margin:8px 0"><div class="rowx" style="padding:0;border:0"><span>${esc(x.name)}</span><b>${F(x.revenue)}</b></div><div class="meter"><i style="width:${Math.max(3,x.revenue/mx*100)}%"></i></div><small>${n1(x.bottles)} bottle(s)</small></div>`).join('')||'<p class="mu">No sales yet.</p>'}</div>
 <div class="card"><b>Busy hours</b>${hr.length?bars(hr.map(h=>[h.h+'h',h.revenue])):'<p class="mu">No sales yet.</p>'}</div>
 <div class="card"><b>Cashiers</b>${d.cashiers.map(c=>`<div class="rowx"><span>${esc(c.name)}<small>${c.n} sale(s)</small></span><b>${F(c.total)}</b></div>`).join('')||'<p class="mu">No sales yet.</p>'}</div></div>
 ${d.branches&&d.branches.length>1?`<div class="card"><b>Branches</b><div style="overflow:auto"><table><thead><tr><th>Branch</th><th class="r">Sales</th><th class="r">Profit</th><th class="r">Expenses</th><th class="r">Net</th></tr></thead><tbody>${d.branches.map(b=>`<tr><td>${esc(b.name)}</td><td class="r">${F(b.revenue)}</td><td class="r">${F(b.profit)}</td><td class="r">${F(b.expenses)}</td><td class="r ${b.net<0?'bad':'ok'}">${F(b.net)}</td></tr>`).join('')}</tbody></table></div></div>`:''}`;
 $('v').scrollTop=sc;HT=setInterval(()=>{if(A.tab=='home'&&!document.hidden&&$('m').className!='on'&&!$('vw'))vHome()},60000)}

/* ---------- Expenses ---------- */
let EP=LS('expp','d');
const eRange=()=>{const d0=new Date().setHours(0,0,0,0),D=864e5,m0=new Date(new Date().getFullYear(),new Date().getMonth(),1).getTime();return EP=='d'?[d0,Date.now()]:EP=='w'?[d0-6*D,Date.now()]:EP=='mo'?[m0,Date.now()]:[d0-29*D,Date.now()]};
let EX=null;
async function vExp(){const[a,b]=eRange();let r;try{r=await api(`/expenses?from=${a}&to=${b}${A.dbAll&&A.user.role=='owner'?'&branch=all':''}`)}catch(e){return $('v').innerHTML='<div class="notice bad">'+esc(e.message)+'</div>'}EX=r;const mx=Math.max(...r.by_cat.map(c=>c.amount),1);
 $('v').innerHTML=`<div class="hb2"><h3>Expenses</h3><button class="b sm" onclick="expM()">＋ Add expense</button></div>
 <div class="chips">${[['d','Today'],['w','7 days'],['mo','This month'],['m','30 days']].map(c=>`<span class="chip ${EP==c[0]?'cur':''}" onclick="EP='${c[0]}';SS('expp',EP);vExp()">${c[1]}</span>`).join('')}</div>
 <div class="kp"><div><small>Total spent</small><b>${F(r.total)}</b></div><div><small>Entries</small><b>${r.rows.length}</b></div></div>
 ${r.by_cat.length?`<div class="card"><b>Where it went</b>${r.by_cat.map(c=>`<div style="margin:8px 0"><div class="rowx" style="padding:0;border:0"><span>${esc(c.category)}</span><b>${F(c.amount)}</b></div><div class="meter"><i style="width:${Math.max(3,c.amount/mx*100)}%"></i></div></div>`).join('')}</div>`:''}
 <div class="card"><b>History</b>${r.rows.map(x=>`<div class="xp"><div class="grow"><b>${esc(x.category)}</b><small>${esc(x.note||'')}${x.note?' · ':''}${esc(x.user||'')} · ${D(x.ts)} · ${esc(x.method)}</small></div><b>${F(x.amount)}</b>${A.user.role=='owner'||(x.user_id==A.user.id&&Date.now()-x.ts<36e5)?`<button class="b2 sm bad" onclick="expDel(${x.id})" aria-label="Remove">✕</button>`:''}</div>`).join('')||'<p class="mu">No expenses in this period.</p>'}</div>
 <small class="mu">Expenses reduce profit on the Home and Reports screens. Cash expenses are not taken from the till automatically; use Till → Cash out for money paid from the drawer.</small>`}
const ECATS=['Rent','Salaries','Electricity & water','Internet & airtime','Transport & fuel','Licences & permits','Repairs','Marketing','Packaging','Other'];
function expM(){const cats=(EX&&EX.categories)||ECATS;M(`<h3>Add expense</h3><div class="chips" id="ecs">${cats.map((c,i)=>`<span class="chip ${i==0?'cur':''}" onclick="document.querySelectorAll('#ecs .chip').forEach(x=>x.classList.remove('cur'));this.classList.add('cur');$('exc').value=this.dataset.c" data-c="${esc(c)}">${esc(c)}</span>`).join('')}</div><input type="hidden" id="exc" value="${esc(cats[0])}">
 ${fld('exa','Amount (KSh)','','number')}${sel('exm','Paid by',[['cash','Cash'],['mpesa','M-Pesa'],['bank','Bank'],['other','Other']],'cash')}${fld('exn','Note (optional)','')}<button class="b w" onclick="expSave()">Save expense</button>`);setTimeout(()=>{const e=$('exa');e&&e.focus()},80)}
async function expSave(){const amt=nv('exa');if(!(amt>0))return T('Enter the amount',1);try{await api('/expenses',{b:{category:v('exc'),amount:amt,method:v('exm'),note:v('exn')}});X();T('Expense saved');if(A.tab=='exp')vExp();else if(A.tab=='home')vHome()}catch(e){T(e.message,1)}}
async function expDel(id){if(!confirm('Remove this expense?'))return;try{await api('/expenses/'+id,{m:'DELETE',b:{}});T('Removed');vExp()}catch(e){T(e.message,1)}}

/* ---------- online shop link (owner) ---------- */
function shopUrl(){return A.cat.settings.shop_url||location.origin+'/shop'}
async function shopLink(how){const u=shopUrl();if(how=='share'&&navigator.share){try{await navigator.share({title:A.cat.settings.biz,text:'Order wines & spirits online',url:u})}catch(e){}return}
 try{await navigator.clipboard.writeText(u);T('Shop link copied')}catch(e){prompt('Copy the shop link:',u)}}

/* live clock in the top bar */
function tickClock(){const e=$('clk');if(!e)return;const d=new Date();e.innerHTML=`<b>${d.toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'})}</b><small>${d.toLocaleDateString('en-KE',{weekday:'short',day:'numeric',month:'short'})}</small>`}
setInterval(tickClock,10000);
/* ---------- lifecycle ---------- */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&A.user){sync();pollAlerts();if(A.tab=='home')vHome()}});
addEventListener('pageshow',e=>{if(e.persisted&&A.user)pollAlerts()});
trap();

(async()=>{if(A.tk&&A.user&&A.cat){try{A.nav=[];A.tab=new URLSearchParams(location.search).get('go')||LS('lasttab',null)||(mgr()?'home':'sell');if(location.search)history.replaceState(history.state,'',location.pathname);await loadCat();await loadShift();shell();sync();pollOrders()}catch(e){shell()}}else login()})();
